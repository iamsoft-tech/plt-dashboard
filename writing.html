<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLT writing sources</title><style>body{max-width:900px;margin:32px auto;padding:0 18px;background:#faf5f1;color:#301d2b;font:16px/1.5 system-ui}button,textarea{font:inherit}button{padding:7px 12px;cursor:pointer}textarea{width:100%;height:62vh;font:15px/1.6 monospace;box-sizing:border-box}p{overflow-wrap:anywhere}</style><h1 id="title"></h1><p id="path"></p><button id="open">Open from project folder</button> <button hidden id="save">Save script draft</button><p role="status" id="status">Choose the Pretty little things project folder on your computer. Files stay on this device.</p><textarea hidden id="body" aria-label="Writing source"></textarea><script>
const params=new URLSearchParams(location.search), act=Number(params.get('act')), kind=params.get('doc'), movie='IP/Productions/Movie/Scripts/', before='IP/Productions/Before China/Scripts/';
const files={bible:'IP/Canon/STORY-BIBLE.md',treatment:movie+'TREATMENT-ACTS-0-3-REVIEW-2026-11-18.md',beats:act===0?before+'PLT-BC-treatment-v008-CONCEPT.md':'IP/Content/STORY-AND-RELEASE-MAP.md',script:act===0?before+'2026-11-18-day-script.md':movie+'ACT-'+act+'-SCRIPT-DRAFT.md'};
const id=x=>document.getElementById(x), valid=[0,1,2,3].includes(act)&&Object.hasOwn(files,kind), path=valid?files[kind]:'', editable=kind==='script'&&act>0;
id('title').textContent=valid?({bible:'Current story bible',treatment:'Four-act treatment',beats:'Act '+act+' · story beats',script:'Act '+act+' · '+(editable?'script draft':'working script')})[kind]:'Unknown source';id('path').textContent=path;id('open').disabled=!valid;
let handle,original;
id('open').onclick=async()=>{try{if(!window.showDirectoryPicker)throw Error('Use desktop Edge or Chrome, or open the file at the path above in your editor.');let dir=await showDirectoryPicker({id:'plt-writing-project',mode:editable?'readwrite':'read'});let parts=path.split('/');for(const name of parts.slice(0,-1))dir=await dir.getDirectoryHandle(name);handle=await dir.getFileHandle(parts.at(-1));original=await(await handle.getFile()).text();let text=original;if((kind==='beats'&&act>0)||kind==='treatment'){let sections=text.split(/(?=^## )/m);let match=sections.find(s=>s.startsWith('## Act '+act+' '));if(match&&kind==='beats')text=match;}id('body').hidden=false;id('body').readOnly=!editable;id('body').value=text;id('save').hidden=!editable;id('status').textContent=editable?'Draft changes require review before production.':'Current project source · read only';}catch(e){id('status').textContent=e.name==='AbortError'?'Folder selection cancelled.':e.message}};
id('save').onclick=async()=>{try{let current=await(await handle.getFile()).text();if(current!==original)throw Error('This file changed in another editor. Copy your edits before reopening.');let text=id('body').value;if(original.includes('\r\n'))text=text.replace(/\r?\n/g,'\r\n');const stream=await handle.createWritable();await stream.write(text);await stream.close();original=text;id('status').textContent='Saved locally · pending script review';}catch(e){id('status').textContent=e.message}};
</script></html>
